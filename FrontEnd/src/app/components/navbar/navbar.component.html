<nav class="navbar">
  <div class="navbar-container">
    <a routerLink="/" class="navbar-brand" (click)="closeMenu()">
      <img src="/logo.png" alt="BookHub" class="brand-logo" />
      <span class="brand-name">BookHub</span>
    </a>

    <div class="navbar-links" [class.open]="menuOpen()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Accueil</a>
      <a routerLink="/catalogue" routerLinkActive="active" (click)="closeMenu()">Catalogue</a>
      @if (auth.isLoggedIn()) {
        <a routerLink="/mes-emprunts" routerLinkActive="active" (click)="closeMenu()">Mes emprunts</a>
        <a routerLink="/mon-espace" routerLinkActive="active" (click)="closeMenu()">Mon espace</a>
      }
      @if (auth.isStaff()) {
        <a routerLink="/admin/dashboard" routerLinkActive="active" (click)="closeMenu()" class="link-admin">Dashboard</a>
      }
      @if (auth.isStaff()) {
        <a routerLink="/livres/nouveau" routerLinkActive="active" (click)="closeMenu()" class="link-admin">+ Livre</a>
      }
    </div>

    <div class="navbar-actions">
      @if (auth.isLoggedIn()) {
        <a routerLink="/profil" class="navbar-user">{{ auth.currentUser()?.email }}</a>
        <button class="btn-outline" (click)="auth.logout()">Déconnexion</button>
      } @else {
        <a routerLink="/connexion" class="btn-outline">Connexion</a>
        <a routerLink="/inscription" class="btn-primary">S'inscrire</a>
      }
    </div>

    <button class="burger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>
