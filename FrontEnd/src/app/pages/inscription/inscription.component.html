<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <span class="login-icon">📚</span>
      <h1>Créer un compte</h1>
      <p>Rejoignez la bibliothèque communautaire</p>
    </div>

    @if (success()) {
      <div class="alert-success">
        ✅ Compte créé ! Redirection vers la connexion…
      </div>
    } @else {

      @if (error()) {
        <div class="alert-error">⚠️ {{ error() }}</div>
      }

      <form (ngSubmit)="onSubmit()" #f="ngForm">
        <div class="form-row">
          <div class="form-group">
            <label for="nom">Nom <span class="required">*</span></label>
            <input id="nom" type="text" [(ngModel)]="nom" name="nom" required
                   placeholder="Dupont" class="form-control" />
          </div>
          <div class="form-group">
            <label for="prenom">Prénom <span class="required">*</span></label>
            <input id="prenom" type="text" [(ngModel)]="prenom" name="prenom" required
                   placeholder="Jean" class="form-control" />
          </div>
        </div>

        <div class="form-group">
          <label for="mail">Email <span class="required">*</span></label>
          <input id="mail" type="email" [(ngModel)]="mail" name="mail" required
                 placeholder="jean.dupont@email.fr" class="form-control" />
        </div>

        <div class="form-group">
          <label for="mdp">Mot de passe <span class="required">*</span></label>
          <input id="mdp" type="password" [(ngModel)]="motDePasse" name="motDePasse" required
                 placeholder="••••••••••••" class="form-control" />
          <span class="hint">12 caractères min., 1 majuscule, 1 chiffre, 1 caractère spécial</span>
        </div>

        <button type="submit" class="btn-submit" [disabled]="isLoading() || f.invalid">
          @if (isLoading()) { Création en cours… } @else { Créer mon compte }
        </button>
      </form>

      <p class="login-footer">
        Déjà inscrit ? <a routerLink="/connexion">Se connecter</a>
      </p>
    }
  </div>
</div>
