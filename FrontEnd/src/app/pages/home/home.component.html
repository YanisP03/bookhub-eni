@for (livre of featuredLivres(); track livre.id) {
  <article class="book-card" [routerLink]="['/catalogue']">
    <div class="book-cover" [class.no-cover]="!livre.couverture">
      @if (livre.couverture) {
        <img [src]="livre.couverture" [alt]="livre.titre" loading="lazy" />
      } @else {
        <span class="cover-placeholder">📖</span>
      }
      <span class="availability-badge" [class.available]="livre.nbDisponibles > 0" [class.unavailable]="livre.nbDisponibles === 0">
        {{ livre.nbDisponibles > 0 ? 'Disponible' : 'Emprunté' }}
      </span>
    </div>
    <div class="book-info">
      <span class="book-category">{{ livre.categorie?.nom }}</span>
      <h3 class="book-title">{{ livre.titre }}</h3>
      <p class="book-author">{{ livre.auteur }}</p>
      <div class="book-rating">
        @for (star of getStars(livre.noteMoyenne); track $index) {
          <span class="star" [class.full]="star === 'full'" [class.half]="star === 'half'">★</span>
        }
      </div>
    </div>
  </article>
}
